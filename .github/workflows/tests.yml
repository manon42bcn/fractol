name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    name: Fractol CI
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check promotion branch
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$GITHUB_HEAD_REF" != dev || "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests into master must come from this repository's dev branch."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install SDL3
        run: brew install sdl3 pkgconf

      - name: Run tests
        run: make -j2 test

      - name: Run Norminette
        run: |
          python3 -m venv "$RUNNER_TEMP/fractol-norminette"
          "$RUNNER_TEMP/fractol-norminette/bin/python" -m pip install norminette==3.3.60
          "$RUNNER_TEMP/fractol-norminette/bin/norminette" srcs inc tests
